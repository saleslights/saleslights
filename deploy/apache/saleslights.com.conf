# saleslights.com (+www) -> 127.0.0.1:3010 (PM2 saleslights-prod). NOT INSTALLED until Nick approves cutover.
<VirtualHost *:80>
    ServerName saleslights.com
    ServerAlias www.saleslights.com
    Alias /.well-known/acme-challenge/ /var/www/saleslights-acme/.well-known/acme-challenge/
    <Directory /var/www/saleslights-acme/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://saleslights.com%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName saleslights.com
    ServerAlias www.saleslights.com
    RewriteEngine On
    # www -> apex, query preserved
    RewriteCond %{HTTP_HOST} ^www\.saleslights\.com$ [NC]
    RewriteRule ^ https://saleslights.com%{REQUEST_URI} [END,NE,R=301]

    # BEGIN SALES LIGHTS AI MOATS TRACKING (carried over verbatim from the old box)
    RewriteRule ^/?v/ai-moats-dripify-alpha/?$ https://lnkd.in/p/gd_s49bX [R=302,L,NE,QSD]
    RewriteRule ^/?v/ai-moats-dripify-beta/?$ https://lnkd.in/p/gd_s49bX [R=302,L,NE,QSD]
    RewriteRule ^/?v/ai-moats-smartlead-alpha/?$ https://lnkd.in/p/gd_s49bX [R=302,L,NE,QSD]
    RewriteRule ^/?v/ai-moats-smartlead-beta/?$ https://lnkd.in/p/gd_s49bX [R=302,L,NE,QSD]
    SetEnvIf Request_URI "^/v/ai-moats-(dripify|smartlead)-(alpha|beta)/?$" ai_moats_click=1
    SetEnvIfNoCase User-Agent "bot|crawler|spider|preview|slurp|curl|python|wget|headless|scanner|safelinks" ai_moats_bot=1
    SetEnvIf X-Saleslights-QA "^ai-moats-verification$" ai_moats_qa=1
    CustomLog /var/log/apache2/saleslights-ai-moats-clicks.log "%{%s}t|%U|%m|%>s|%{ai_moats_bot}e|%{ai_moats_qa}e" env=ai_moats_click
    # END SALES LIGHTS AI MOATS TRACKING

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/
    ErrorLog ${APACHE_LOG_DIR}/saleslights.com-error.log
    CustomLog ${APACHE_LOG_DIR}/saleslights.com-access.log combined
    # SSLCertificateFile / KeyFile: issued by DNS-01 (Route 53) BEFORE the DNS flip.
</VirtualHost>
</IfModule>
