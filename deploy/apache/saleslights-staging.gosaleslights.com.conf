# saleslights-staging.gosaleslights.com -> 127.0.0.1:3011 (PM2 saleslights-staging). Noindex at the edge as well as in the app.
<VirtualHost *:80>
    ServerName saleslights-staging.gosaleslights.com
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://saleslights-staging.gosaleslights.com%{REQUEST_URI} [END,NE,R=301]
    ErrorLog ${APACHE_LOG_DIR}/saleslights-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/saleslights-staging-access.log combined
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName saleslights-staging.gosaleslights.com
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:3011/
    ProxyPassReverse / http://127.0.0.1:3011/
    ErrorLog ${APACHE_LOG_DIR}/saleslights-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/saleslights-staging-access.log combined
    # SSLCertificateFile / KeyFile lines are added by certbot.
</VirtualHost>
</IfModule>
